
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p6_display_flex</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root{
            --primary-color: orange;
            --secondary-color: purple;
            --tertiary-color: mediumseagreen;
        }

        .container{
            display: flex;
            width: 100%;
            height: 100vh;
        }

        section{
            width: 50%;
            height: 100%;
        }

        #naranja{
            background-color: var(--primary-color);
            width: 100%;
            height: 50%;
        }

        #morado{
            background-color: var(--secondary-color);
            width: 100%;
            height: 50%;
        }

        .verde{
            background-color: var(--tertiary-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
        }
      
       @media (max-width: 600px) {
    .container {
        flex-direction: column;
    }

    section {
        width: 100%;
        height: 50%;
    }
}

    </style>
</head>

<body>

    <div class="container">

        <section>
            <div id="naranja"></div>
            <div id="morado"></div>
        </section>

        <section class="verde">
            <div>
                <h1>Buenas tardes <a href="https://www.figma.com/design/fmKaHXKmKhTvy8CRSF3qxb/Untitled?node-id=0-1&t=x4Ym3jKot6k90PPF-1" >diseño figma</a></h1>
            </div>

            <div>
                <h1>Buenas noches</h1>
            </div>
        </section>

    </div>

</body>
</html>
